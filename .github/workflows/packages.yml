name: packages

on:
  push:
    branches: [main]
  pull_request:

# A design system that only passes on the author's machine is not a design
# system. Every step below runs the npm script the repository documents, in the
# image `make` uses locally, pinned by digest — so the gate that approves a
# release in CI is the one a person ran.
permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that runs on every push. It installs the library toolchain and
  # nothing else: the browser harness lives in `e2e/` as its own project,
  # because Playwright is most of an install and this job never uses it.
  verify:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2

    steps:
      - uses: actions/checkout@v7

      # Keyed on the lockfile, so an unchanged dependency tree is a restore
      # rather than a download. `npm ci` still installs from the lockfile; the
      # cache only removes the network round trips.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-root-

      - run: npm ci --no-audit --no-fund

      - name: Formatting
        run: npm run format:check

      - name: Lint, including the package boundary and template accessibility
        run: npm run lint

      - name: Component file structure
        run: npm run files:check

      - name: Credentials, local paths, personal data, third-party names
        run: npm run hygiene:check

      - name: Tokens match their source and every contrast pair holds
        run: |
          npm run tokens:check
          npm run tokens:test

      - name: Build both Angular packages
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Public API matches its committed report
        run: npm run api:check

      - name: Pack the release artefacts
        run: npm run pack:all

      - name: Tarball contents, exports, peers, and side effects
        run: npm run package:check

      - name: Keep the artefacts for the consumer jobs
        uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: artifacts/*.tgz
          retention-days: 1

  # The release evidence: the packed artefacts installed into real consumers,
  # never a workspace link. A symlink resolves whatever is on disk and ignores
  # `files` and `exports` entirely, so it proves nothing about what ships.
  consumers:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # The image already carries the browsers. Downloading them again is a
      # few hundred megabytes for no change in what is tested.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: artifacts

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-consumers-${{ hashFiles('fixtures/*/package-lock.json', 'compat/*/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: npm-consumers-

      - name: Compatibility harness at the floor of the declared peer range
        working-directory: compat/angular-22
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund ../../artifacts/cordly-tokens.tgz ../../artifacts/cordly-ui.tgz ../../artifacts/cordly-widgets.tgz
          npx ng build

      - name: Browser fixture
        working-directory: fixtures/browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund ../../artifacts/cordly-tokens.tgz ../../artifacts/cordly-ui.tgz ../../artifacts/cordly-widgets.tgz
          npx ng build

      - name: Server-rendered fixture
        working-directory: fixtures/ssr
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund ../../artifacts/cordly-tokens.tgz ../../artifacts/cordly-ui.tgz ../../artifacts/cordly-widgets.tgz
          npx ng build

      - name: Browser, mobile, and server-rendering gates
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright test

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
