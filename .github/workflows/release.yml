name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

# Nothing is published from a laptop. The tarballs that reach the registry are
# the ones this run built, from this commit, and npm provenance records that
# link so anyone can check it with `npm audit signatures`.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full gate again rather than trusting the CI run on the same commit.
  # A release is the one moment where re-running everything is cheap relative to
  # what it protects: a published version cannot be taken back.
  verify:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-root-
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: The release is coherent
        run: node tools/release.mjs check
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: artifacts/*.tgz
          retention-days: 7

  consumers:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: artifacts
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-consumers-${{ hashFiles('fixtures/*/package-lock.json', 'compat/*/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: npm-consumers-
      - name: Compatibility harness at the floor of the peer range
        working-directory: compat/angular-22
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund ../../artifacts/cordly-tokens.tgz ../../artifacts/cordly-ui.tgz ../../artifacts/cordly-widgets.tgz
          npx ng build
      - name: Browser fixture
        working-directory: fixtures/browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund ../../artifacts/cordly-tokens.tgz ../../artifacts/cordly-ui.tgz ../../artifacts/cordly-widgets.tgz
          npx ng build
      - name: Server-rendered fixture
        working-directory: fixtures/ssr
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund ../../artifacts/cordly-tokens.tgz ../../artifacts/cordly-ui.tgz ../../artifacts/cordly-widgets.tgz
          npx ng build
      - name: Browser, mobile, and server-rendering gates
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright test

  publish:
    needs: [verify, consumers]
    runs-on: ubuntu-latest
    # No `environment:` here on purpose. Naming one that has not been created
    # fails the job before it starts, which is a bad first experience for a fresh
    # repository. Adding `environment: npm` later is how you put a required
    # approval in front of publishing; see docs/release.md.
    permissions:
      # `id-token: write` is what makes provenance possible: it lets the runner
      # get a short-lived OIDC token that npm verifies, so the attestation is
      # produced by GitHub rather than asserted by the publisher.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-root-

      - run: npm ci --no-audit --no-fund

      # Rebuilt here rather than downloaded. `npm publish` packs from the
      # directory, so what reaches the registry has to be produced in the same
      # job — publishing a downloaded artifact would break the provenance link
      # between the tarball and this run.
      - run: npm run build

      # `release.mjs publish` decides, not this workflow. It refuses any 0.x
      # version — pre-1.0 releases are GitHub artifacts that consumers vendor —
      # and it skips anything already on the registry. Both refusals are printed,
      # so a run that publishes nothing says which reason applied rather than
      # looking like a run that did nothing.
      #
      # A missing NPM_TOKEN is therefore not an error before 1.0. It becomes one
      # the first time a 1.x tag is pushed, which is the right moment to notice.
      - name: Publish anything eligible and not already on the registry
        id: publish
        run: node tools/release.mjs publish ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack the artefacts to attach to the release
        if: github.event_name == 'push'
        run: npm run pack:all

      - name: GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
          body: |
            **Pre-1.0: these packages are not on npm.** The tarballs attached
            below are the release. Consumers vendor them and record their
            digests — see
            [docs/release.md](https://github.com/cordlybot/cordly-packages/blob/main/docs/release.md)
            for how, and for what changes at 1.0.

            Everything here was verified by this run: the full gate, the packed
            artefacts, both fixture consumers, the compatibility harness at the
            floor of the peer range, and the browser, mobile, and
            server-rendering accessibility gates.

            See [CHANGELOG.md](https://github.com/cordlybot/cordly-packages/blob/main/CHANGELOG.md)
            for what changed in each package, and
            [docs/compatibility.md](https://github.com/cordlybot/cordly-packages/blob/main/docs/compatibility.md)
            for the supported Angular and TypeScript versions.
