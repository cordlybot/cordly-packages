name: Proposal
description: Something the packages should do and do not.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        Two questions decide most proposals here, so answering them up front
        saves a round trip.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to build, and what is in the way?
      description: The problem, not the solution. What does your application currently have to do instead?
    validations:
      required: true
  - type: textarea
    id: neutral
    attributes:
      label: Can its public API be described without naming a route, an endpoint, a Discord object, or a permission?
      description: >
        This is the line that decides whether something is shareable at all. If
        it cannot be described that way, the application owns it and composes
        primitives locally — which is a fine answer, and we can help with the
        composition.
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Which surfaces need it?
      description: >
        A primitive with one caller has no feedback: its API is a guess and its
        accessibility is untested against real content. Two independent callers
        is usually the bar.
    validations:
      required: true
