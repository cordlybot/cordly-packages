<fieldset class="cordly-preference-group__field">
  <legend class="cordly-preference-group__legend">{{ label() }}</legend>

  @if (description()) {
    <p class="cordly-preference-group__description">{{ description() }}</p>
  }

  <div class="cordly-preference-group__options">
    @for (option of options(); track option.id) {
      <label class="cordly-preference-group__option">
        <input
          class="cordly-preference-group__input"
          type="radio"
          [name]="groupName"
          [value]="option.id"
          [checked]="option.id === value()"
          (change)="choose(option.id)"
        />
        <span class="cordly-preference-group__option-label">{{ option.label }}</span>
      </label>
    }
  </div>
</fieldset>
