<div class="cordly-empty-state__art" aria-hidden="true">
  <ng-content select="[cordly-empty-state-art]" />
</div>

<!--
  A real heading element per level rather than one element with role="heading"
  and aria-level. Both map to the same thing in the accessibility tree, and the
  native element is also what reader modes, text extraction, and a document
  outline read — so the branch is worth the repetition.
-->
@switch (headingLevel()) {
  @case (1) {
    <h1 class="cordly-empty-state__heading">{{ heading() }}</h1>
  }
  @case (2) {
    <h2 class="cordly-empty-state__heading">{{ heading() }}</h2>
  }
  @case (4) {
    <h4 class="cordly-empty-state__heading">{{ heading() }}</h4>
  }
  @default {
    <h3 class="cordly-empty-state__heading">{{ heading() }}</h3>
  }
}

@if (body()) {
  <p class="cordly-empty-state__body">{{ body() }}</p>
}

<p class="cordly-empty-state__body"><ng-content /></p>

<div class="cordly-empty-state__actions">
  <ng-content select="[cordly-empty-state-action]" />
</div>
