<!--
  A click handler on the <dialog> itself, with no keyboard equivalent, and both
  accessibility rules disabled deliberately.

  The handler exists only to tell a backdrop click from a click inside the panel,
  and the backdrop has no node of its own to attach to. Keyboard dismissal is not
  missing: it is the native `cancel` event, which is what Escape fires on a modal
  dialog, and it is handled below. The element is focusable and focus-trapped by
  `showModal()`, so `interactive-supports-focus` is satisfied by the platform
  rather than by an attribute.
-->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<dialog
  #surface
  class="cordly-dialog__surface"
  [attr.role]="alert() ? 'alertdialog' : null"
  [attr.aria-labelledby]="headingId"
  [attr.aria-describedby]="description() ? descriptionId : null"
  (close)="handleNativeClose()"
  (cancel)="handleCancel($event)"
  (click)="handleBackdropClick($event)"
>
  <div class="cordly-dialog__panel">
    <div class="cordly-dialog__header">
      <h2 class="cordly-dialog__heading" [id]="headingId">{{ heading() }}</h2>
      @if (dismissLabel(); as label) {
        <button
          type="button"
          class="cordly-dialog__dismiss"
          [attr.aria-label]="label"
          (click)="close('dismiss')"
        >
          <span class="cordly-dialog__dismiss-mark" aria-hidden="true"></span>
        </button>
      }
    </div>

    @if (description()) {
      <p class="cordly-dialog__description" [id]="descriptionId">{{ description() }}</p>
    }

    <div class="cordly-dialog__content"><ng-content /></div>

    <div class="cordly-dialog__footer">
      <ng-content select="[cordly-dialog-actions]" />
    </div>
  </div>
</dialog>
